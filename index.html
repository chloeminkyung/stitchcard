<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stitchcard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="data:image/png" href="favicon-heart.png?v=2">
  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Imperial+Script&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: #fff; color: #111; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.wrap { height: 100vh; height: 100dvh; width: 72%; max-width: 820px; min-width: 320px; margin: 0 auto; padding: 14px 20px 12px; display: flex; flex-direction: column; gap: 8px; }
header { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 4px; }
#titleCanvas { display: block; }
header p { color: #888; font-size: 11.5px; text-align: center; }
.stage { flex: 1 1 auto; min-height: 0; border: 1px solid #e0e0e0; border-radius: 8px; overflow: hidden; position: relative; aspect-ratio: 1 / 1; }
.stage.drag { border-color: #111; }
#outCanvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#outCanvas:active { cursor: grabbing; }
.hint { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); font-size: 10.5px; color: rgba(0,0,0,.4); background: rgba(255,255,255,.75); padding: 2px 10px; border-radius: 20px; pointer-events: none; white-space: nowrap; }
#fileInput { position: absolute; width: 1px; height: 1px; opacity: 0; }
.bar { flex: 0 0 auto; border-top: 1px solid #eee; padding-top: 9px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.fi { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #777; }
input[type=range] { width: 90px; accent-color: #111; }
input[type=text] { font-size: 12.5px; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; width: 130px; font-family: inherit; }
input[type=color] { width: 28px; height: 26px; padding: 0; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; }
.chk { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #777; cursor: pointer; }
.chk input { width: 14px; height: 14px; }
button, .btn-upload { font-family: inherit; font-size: 12px; padding: 7px 13px; background: #fff; color: #111; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; white-space: nowrap; display: inline-block; text-align: center; }
button:hover, .btn-upload:hover { color: #b82424; }
button.on { }
.sp { flex: 1 1 auto; }
.st { font-size: 11px; color: #aaa; }  :root.dark .wrap{filter:invert(1) hue-rotate(180deg);}  :root.dark body{background:#000;}

  :root.dark #outCanvas{filter:invert(1) hue-rotate(180deg);}
  :root.dark input[type=color]{filter:invert(1) hue-rotate(180deg);}

</style>
</head>
<body>
<button id="nightBtn" onclick="var d=document.documentElement.classList.toggle('dark');this.textContent=d?'☀':'☽';this.style.color=d?'#fff':'#000';this.style.filter='none';" style="position:fixed;top:14px;right:20px;background:none;border:none;font-size:20px;cursor:pointer;z-index:99999;padding:4px;color:#000;">☽</button>
<div class="wrap">
  <header>
    <canvas id="titleCanvas" style="visibility:hidden;"></canvas>
    <p>Upload a photo or video, or use your camera — drag the cross-stitched text anywhere on it.</p>
  </header>
  <div class="stage" id="stage">
    <canvas id="outCanvas"></canvas>
    <span class="hint">Drag the stitched text to reposition</span>
  </div>
  <input type="file" id="fileInput" accept="image/*,video/*">
  <div class="bar" style="display:flex;flex-direction:column;gap:14px;">

    <!-- Row 1: indicator + text + font + add + remove + thread -->
    <div style="display:flex;align-items:center;gap:6px;">
      <span id="layerIndicator" style="font-size:11px;color:#aaa;white-space:nowrap;min-width:28px;text-align:center;flex-shrink:0;">1/1</span>
      <input type="text" id="stitchText" value="Welcome" maxlength="40" placeholder="Text…"
        style="flex:2;font-size:12.5px;height:40px;padding:0 10px;border:1px solid #e0e0e0;border-radius:10px;font-family:inherit;background:#f9f9f9;min-width:0;">
      <select id="fontSelect"
        style="flex:2;font-family:inherit;font-size:11.5px;padding:0 8px;border:1px solid #e0e0e0;border-radius:10px;background:#f9f9f9;color:#111;appearance:none;-webkit-appearance:none;min-width:0;height:40px;">
        <option value="'Pinyon Script', cursive">Pinyon Script</option>
        <option value="'Imperial Script', cursive" selected>Imperial Script</option>
      </select>
      <button id="addTextBtn"    style="flex-shrink:0;padding:11px 14px;border-radius:10px;background:#f2f2f2;border:none;font-size:16px;cursor:pointer;line-height:1;">+</button>
      <button id="removeTextBtn" style="flex-shrink:0;padding:11px 14px;border-radius:10px;background:#f2f2f2;border:none;font-size:16px;cursor:pointer;line-height:1;">−</button>
      <span style="font-size:11.5px;color:#888;flex-shrink:0;">Thread</span><input type="color" id="threadColor" value="#b82424"
        style="flex-shrink:0;width:36px;height:36px;padding:2px;border:none;border-radius:8px;cursor:pointer;background:none;">
      <span style="font-size:11.5px;color:#888;flex-shrink:0;margin-left:4px;">Size</span>
      <input type="number" id="fontSize" min="1" max="200" step="1" value="14"
        style="width:52px;font-size:12px;padding:0 6px;height:40px;border:1px solid #e0e0e0;border-radius:8px;font-family:inherit;text-align:center;">
    </div>

    <!-- Row 2: thread thickness + stitches slider (global) -->
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="display:flex;align-items:center;gap:6px;font-size:11.5px;color:#888;flex-shrink:0;">
        <span style="white-space:nowrap;">Thickness</span>
        <input type="range" id="threadThickness" min="0.1" max="1.2" step="0.05" value="0.65"
          style="width:70px;accent-color:#111;">
      </div>

    </div>

    <!-- Row 3: upload + camera + save/shoot -->
    <div style="display:flex;gap:6px;">
      <label for="fileInput"
        style="flex:1;font-family:inherit;font-size:12px;padding:10px 16px;background:#f2f2f2;border:none;border-radius:10px;cursor:pointer;text-align:center;display:flex;align-items:center;justify-content:center;">
        Upload
      </label>
      <button id="cameraBtn" style="flex:1;padding:10px 16px;border-radius:10px;background:#f2f2f2;border:none;font-size:13px;font-family:inherit;cursor:pointer;">Camera</button>
      <button id="videoRecBtn" style="display:none;flex:1;padding:10px 16px;border-radius:10px;background:#f2f2f2;border:none;font-size:13px;font-family:inherit;cursor:pointer;">🎬 Video</button>
      <button id="downloadBtn" style="flex:1;padding:10px 16px;border-radius:10px;background:#f2f2f2;border:none;font-size:13px;font-family:inherit;cursor:pointer;">Save PNG</button>
      <button id="patternBtn" style="flex:1;padding:10px 16px;border-radius:10px;background:#f2f2f2;border:none;font-size:13px;font-family:inherit;cursor:pointer;">Pattern</button>
      <button id="playBtn" style="display:none;flex:1;padding:10px 16px;border-radius:10px;background:#f2f2f2;border:none;font-size:13px;font-family:inherit;cursor:pointer;">Pause</button>
    </div>

    <span class="st" id="status" style="display:block;min-height:1em;">&nbsp;</span>
  </div>

</div>
<video id="videoEl" style="display:none" muted playsinline loop></video>

  // Pre-built yarn pattern canvases keyed by "color_size"
  var yarnPatternCache = {};

  // Build a tinted yarn stroke canvas for a given color + stroke width
  function buildYarnStroke(hexColor, strokeW) {
    var key = hexColor + '_' + strokeW;
    if (yarnPatternCache[key]) return yarnPatternCache[key];
    if (!yarnReady) return null;

    // The yarn image is a horizontal thread — we'll use a thin horizontal strip
    // from the centre of the image and tile it as a pattern along each arm
    var srcH = yarnImg.height;
    var srcW = yarnImg.width;

    // Extract a tile: full width x strokeW height from centre of yarn image
    var tileW = Math.min(srcW, 200); // use portion for tiling
    var tileH = Math.max(4, Math.round(strokeW));
    var tile = document.createElement('canvas');
    tile.width = tileW; tile.height = tileH;
    var tc = tile.getContext('2d');

    // Draw the yarn image centred vertically into the tile
    var sy = (srcH - tileH) / 2;
    tc.drawImage(yarnImg, 0, sy, tileW, tileH, 0, 0, tileW, tileH);

    // Tint: multiply with the chosen thread color
    tc.globalCompositeOperation = 'multiply';
    tc.fillStyle = hexColor;
    tc.fillRect(0, 0, tileW, tileH);

    // Restore some brightness
    tc.globalCompositeOperation = 'screen';
    tc.globalAlpha = 0.15;
    tc.fillStyle = '#ffffff';
    tc.fillRect(0, 0, tileW, tileH);

    yarnPatternCache[key] = tile;
    return tile;
  }

  // ── Rasterize (thin/regular weight for title) ────────────────────────────
  function rasterizeThin(text, font, cellPx) {

  }

  // ── Rasterize ─────────────────────────────────────────────────────────────
  // cellPx: source pixels per stitch cell. SLIDER changes this.
  // Smaller cellPx = more stitches (finer). Bigger = fewer (coarser).
  // Physical stitch size on screen is ALWAYS fixed — only count changes.
  function rasterize(text, font, cellPx, fixedCols, fixedRows) {
    var t = (text || '').trim();
    if (!t) return { mask: [], cols: 1, rows: 1 };
    var fs = 240;

    var probe = document.createElement('canvas').getContext('2d');
    probe.font = '400 ' + fs + 'px ' + font;
    var m   = probe.measureText(t);
    var asc = m.actualBoundingBoxAscent  || fs * 0.82;
    var dsc = m.actualBoundingBoxDescent || fs * 0.22;
    var lft = m.actualBoundingBoxLeft    || 0;
    var rgt = m.actualBoundingBoxRight   || m.width;
    var pad = 18;
    var W = Math.max(30, Math.ceil(lft + rgt) + pad * 2);
    var H = Math.max(30, Math.ceil(asc + dsc) + pad * 2);
    var g = document.createElement('canvas');
    g.width = W; g.height = H;
    var gc = g.getContext('2d');
    gc.fillStyle = '#fff'; gc.fillRect(0, 0, W, H);
    gc.font = '400 ' + fs + 'px ' + font;
    gc.fillStyle = '#000'; gc.textBaseline = 'alphabetic';
    var bf = fs * 0.010;
    gc.fillText(t, pad + lft - bf, pad + asc);
    gc.fillText(t, pad + lft + bf, pad + asc);
    gc.fillText(t, pad + lft,      pad + asc - bf);
    gc.fillText(t, pad + lft,      pad + asc + bf);
    gc.fillText(t, pad + lft,      pad + asc);
    var cols = fixedCols || Math.max(4, Math.round(W / cellPx));
    var rows;
    if (fixedRows) {
      rows = fixedRows;
    } else if (fixedCols) {
      // preserve actual text aspect ratio
      rows = Math.max(2, Math.round(cols * (H / W)));
    } else {
      rows = Math.max(4, Math.round(H / cellPx));
    }
    var sc = document.createElement('canvas');
    sc.width = cols; sc.height = rows;
    var sctx = sc.getContext('2d', { willReadFrequently: true });
    sctx.imageSmoothingEnabled = true;
    sctx.drawImage(g, 0, 0, cols, rows);
    var data = sctx.getImageData(0, 0, cols, rows).data;
    var mask = [];
    for (var r = 0; r < rows; r++)
      for (var c = 0; c < cols; c++) {
        var i = (r * cols + c) * 4;
        if (data[i] * 0.299 + data[i+1] * 0.587 + data[i+2] * 0.114 < 210)
          mask.push({ c: c, r: r });
      }
    return { mask: mask, cols: cols, rows: rows };
  }

  // ── Draw one X stitch using the yarn texture on each arm ──────────────────
  function drawStitch(ctx, cx, cy, size, color, thin) {
    var pad = thin ? size * 0.05 : size * -0.08;
    var thk = (typeof _thkVal !== "undefined") ? _thkVal : (function(){ var el=document.getElementById("threadThickness"); return el?parseFloat(el.value):0.70; })(); var lw = thin ? Math.max(0.8, size * 0.16) : Math.max(1, size * thk);

    var x1 = cx + pad,        y1 = cy + pad;
    var x2 = cx + size - pad, y2 = cy + size - pad;
    var x3 = cx + size - pad, y3 = cy + pad;
    var x4 = cx + pad,        y4 = cy + size - pad;

    function drawArm(ax1, ay1, ax2, ay2) {
      var dx = ax2 - ax1, dy = ay2 - ay1;
      var len = Math.sqrt(dx*dx + dy*dy) || 1;
      var angle = Math.atan2(dy, dx);

      ctx.save();
      ctx.translate(ax1, ay1);
      ctx.rotate(angle);

      // rounded pill clip path
      ctx.beginPath();
      var r = lw / 2;
      ctx.moveTo(r, -r);
      ctx.lineTo(len - r, -r);
      ctx.arc(len - r, 0, r, -Math.PI/2, Math.PI/2);
      ctx.lineTo(r, r);
      ctx.arc(r, 0, r, Math.PI/2, -Math.PI/2);
      ctx.closePath();
      ctx.clip();

      // base fill
      ctx.fillStyle = color;
      ctx.fillRect(-r, -r, len + lw, lw);

      // yarn texture stretched along the arm
      if (yarnReady && !thin) {
        var srcH = yarnImg.height, srcW = yarnImg.width;
        var sy = srcH * 0.28, sh = srcH * 0.44;
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
        ctx.drawImage(yarnImg, 0, sy, srcW, sh, 0, -r, len, lw);
        // tint to chosen colour
        ctx.globalCompositeOperation = 'multiply';
        ctx.fillStyle = color;
        ctx.globalAlpha = 1.0;
        ctx.fillRect(0, -r, len, lw);
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
      }

      // Dull matte thread: dark edges for roundness, NO bright highlight
      var grad = ctx.createLinearGradient(0, -r, 0, r);
      grad.addColorStop(0,    'rgba(0,0,0,0.60)');
      grad.addColorStop(0.25, 'rgba(0,0,0,0.15)');
      grad.addColorStop(0.50, 'rgba(0,0,0,0.00)');
      grad.addColorStop(0.75, 'rgba(0,0,0,0.15)');
      grad.addColorStop(1,    'rgba(0,0,0,0.60)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, -r, len, lw);

      ctx.restore();
    }

    // Back arm first (\), then front arm (/) on top
    drawArm(x1, y1, x2, y2);
    drawArm(x3, y3, x4, y4);

    // Crossing darkening at centre
    if (!thin) {
      var mx = cx + size / 2, my = cy + size / 2;
      ctx.save();
      ctx.globalCompositeOperation = 'multiply';
      ctx.globalAlpha = 0.50;
      ctx.fillStyle = color;
      var ds = lw * 0.55;
      ctx.beginPath();
      ctx.moveTo(mx, my - ds); ctx.lineTo(mx + ds, my);
      ctx.lineTo(mx, my + ds); ctx.lineTo(mx - ds, my);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  // ── Background ────────────────────────────────────────────────────────────
  function drawBackground(ctx, cw, ch) {
    ctx.fillStyle = '#f0ece4';
    ctx.fillRect(0, 0, cw, ch);
    if (wallReady) {
      // draw paper full canvas — no inner grey frame
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.18)';
      ctx.shadowBlur  = Math.min(cw, ch) * 0.03;
      ctx.shadowOffsetX = Math.min(cw, ch) * 0.005;
      ctx.shadowOffsetY = Math.min(cw, ch) * 0.010;
      // draw paper with equal padding on all 4 sides
      var pad2 = Math.min(cw, ch) * 0.06;
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.18)';
      ctx.shadowBlur = pad2 * 0.8;
      ctx.shadowOffsetX = pad2 * 0.1;
      ctx.shadowOffsetY = pad2 * 0.15;
      ctx.drawImage(wallImg, pad2, pad2, cw - pad2*2, ch - pad2*2);
      ctx.restore();
      ctx.restore();
    }
  }



  // ── Photo: centered on paper with padding, like a glued photo ────────────
  function drawPhoto(ctx, el, sw, sh, dw, dh) {
    var pad = Math.min(dw, dh) * 0.18; // padding around photo
    var aw = dw - pad * 2, ah = dh - pad * 2;
    var sr = sw/sh, ar = aw/ah, W, H, dx, dy;
    if (sr > ar) { W=aw; H=aw/sr; dx=pad; dy=pad+(ah-H)/2; }
    else         { H=ah; W=ah*sr; dx=pad+(aw-W)/2; dy=pad; }
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,0.10)';
    ctx.shadowBlur=Math.min(dw,dh)*0.012;
    ctx.shadowOffsetX=Math.min(dw,dh)*0.003;
    ctx.shadowOffsetY=Math.min(dw,dh)*0.005;
    ctx.drawImage(el, dx, dy, W, H);
    ctx.restore();
  }

  // ── Slider → cellPx mapping ───────────────────────────────────────────────
  // Slider UP = more stitches (smaller cellPx), Slider DOWN = fewer stitches (bigger cellPx)
  // Physical stitch size on canvas is ALWAYS fixed at cs = cw * 0.044
  function getOverlayCellPx() {
    return 8; // fixed density
  }

  // ── Text overlay ──────────────────────────────────────────────────────────
  function drawTextOverlay(ctx, cw, ch) {
    for (var li = 0; li < layers.length; li++) {
      var layer = layers[li];
      if (!layer.mask || !layer.mask.mask.length) continue;
      var cs = Math.max(1, parseFloat(layer._fontSize || 14) / 3);
      var _thkVal = parseFloat(layer._thickness || 0.70);
      var ox = layer.pos.x * cw - (layer.mask.cols * cs) / 2;
      var oy = layer.pos.y * ch - (layer.mask.rows * cs) / 2;
      var col = layer.color;

      // needle holes at 4 corners of each cell
      function drawHole(hx, hy) {
        var hr = Math.max(0.5, cs * 0.14);
        var sg = ctx.createRadialGradient(hx, hy, 0, hx, hy, hr * 2.8);
        sg.addColorStop(0,   'rgba(0,0,0,0.22)');
        sg.addColorStop(0.6, 'rgba(0,0,0,0.10)');
        sg.addColorStop(1,   'rgba(0,0,0,0.00)');
        ctx.save(); ctx.fillStyle = sg;
        ctx.beginPath(); ctx.arc(hx, hy, hr*2.8, 0, Math.PI*2); ctx.fill(); ctx.restore();
        ctx.save(); ctx.fillStyle = 'rgba(20,10,5,0.70)';
        ctx.beginPath(); ctx.arc(hx, hy, hr, 0, Math.PI*2); ctx.fill(); ctx.restore();
        ctx.save(); ctx.fillStyle = 'rgba(245,238,228,0.90)';
        ctx.beginPath(); ctx.arc(hx, hy, hr*0.45, 0, Math.PI*2); ctx.fill(); ctx.restore();
      }

      for (var i = 0; i < layer.mask.mask.length; i++) {
        var p = layer.mask.mask[i];
        var bx = ox + p.c * cs, by = oy + p.r * cs;
        drawHole(bx,      by);
        drawHole(bx + cs, by);
        drawHole(bx,      by + cs);
        drawHole(bx + cs, by + cs);
      }

      for (var i = 0; i < layer.mask.mask.length; i++) {
        var p = layer.mask.mask[i];
        drawStitch(ctx, ox + p.c * cs, oy + p.r * cs, cs, col, null, false);
      }
    }
  }

  // ── Main render ───────────────────────────────────────────────────────────
  function renderAll() {
    var d = ensureDims(), cw = d.cw, ch = d.ch;
    octx.clearRect(0, 0, cw, ch);
    drawBackground(octx, cw, ch);
    if (source) { try { drawPhoto(octx, source.el, source.w, source.h, cw, ch); } catch(e){} }
    drawTextOverlay(octx, cw, ch);
  }

  // ── Title ─────────────────────────────────────────────────────────────────
  function renderTitle() {
    if (!titleMask || !titleMask.mask.length) return;
    var hdr = titleCanvas.parentElement;
    var tw = 400;
    var cs = tw / titleMask.cols;
    var th = titleMask.rows * cs;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    titleCanvas.width  = Math.round(tw * dpr);
    titleCanvas.height = Math.round(th * dpr);
    titleCanvas.style.width  = tw + 'px';
    titleCanvas.style.height = th + 'px';
    tctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    tctx.clearRect(0, 0, tw, th);
    for (var i = 0; i < titleMask.mask.length; i++) {
      var p = titleMask.mask[i];
      drawStitch(tctx, p.c * cs, p.r * cs, cs, '#111111', true);
    }
  }

  function tick(ts) {
    if (source && (source.type === 'video' || source.type === 'camera')) {
      if ((!videoEl.paused && !videoEl.ended) || source.type === 'camera') {
        if (ts - lastFrame >= FPS) { renderAll(); lastFrame = ts; }
      }
      rafId = requestAnimationFrame(tick);
    }
  }
  function startLoop() { if (rafId) cancelAnimationFrame(rafId); rafId = requestAnimationFrame(tick); }
  function stopLoop()  { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }

  // ── High-res A4 pattern export ──────────────────────────────────────────
  function buildPatternCanvas() {
    var PW = 1240, PH = 1754;
    var pc = document.createElement('canvas');
    pc.width = PW; pc.height = PH;
    var ctx = pc.getContext('2d');
    var margin = 80;
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, PW, PH);
    ctx.fillStyle = '#999'; ctx.font = '24px monospace'; ctx.textAlign = 'left';
    ctx.fillText('Stitchcard  ·  cross-stitch pattern', margin, margin - 20);
    ctx.font = '20px monospace'; ctx.fillStyle = '#bbb';
    ctx.fillText('Print at 100%  |  1 cell = 5mm  |  pierce corners with awl', margin, margin + 10);
    ctx.strokeStyle = '#ccc'; ctx.lineWidth = 1.5; ctx.setLineDash([10, 8]);
    ctx.strokeRect(margin-20, margin-40, PW-(margin-20)*2, PH-(margin-40)*2);
    ctx.setLineDash([]);
    // Compute a single global cs for all layers (same scale for all)
    var maxW = PW - margin * 2;
    var validLayers = layers.filter(function(l){ return l.mask && l.mask.mask.length; });
    var totalRows = validLayers.reduce(function(s,l){ return s + l.mask.rows + 4; }, 0);
    var availH = PH - margin*2 - 80;
    var maxCols = validLayers.reduce(function(m,l){ return Math.max(m, l.mask.cols); }, 1);
    var globalCs = Math.max(2, Math.min(
      Math.floor(maxW / maxCols),
      Math.floor(availH / totalRows)
    ));

    var yOffset = margin + 60;
    for (var li = 0; li < layers.length; li++) {
      var layer = layers[li];
      if (!layer.mask || !layer.mask.mask.length) continue;
      var cs = globalCs;
      var ox = PW/2 - (layer.mask.cols * cs) / 2;
      var oy = yOffset;
      ctx.strokeStyle = '#e8e8e8'; ctx.lineWidth = 0.8;
      for (var c2=0;c2<=layer.mask.cols;c2++){ctx.beginPath();ctx.moveTo(ox+c2*cs,oy);ctx.lineTo(ox+c2*cs,oy+layer.mask.rows*cs);ctx.stroke();}
      for (var r2=0;r2<=layer.mask.rows;r2++){ctx.beginPath();ctx.moveTo(ox,oy+r2*cs);ctx.lineTo(ox+layer.mask.cols*cs,oy+r2*cs);ctx.stroke();}
      ctx.strokeStyle = layer.color || '#b82424';
      ctx.lineWidth = Math.max(2, cs * 0.18); ctx.lineCap = 'round';
      layer.mask.mask.forEach(function(p) {
        var x=ox+p.c*cs+cs*0.15, y=oy+p.r*cs+cs*0.15, e=cs*0.70;
        ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+e,y+e);ctx.stroke();
        ctx.beginPath();ctx.moveTo(x+e,y);ctx.lineTo(x,y+e);ctx.stroke();
      });
      var dr = Math.max(2, cs * 0.12); ctx.fillStyle = '#333';
      layer.mask.mask.forEach(function(p) {
        [[0,0],[1,0],[0,1],[1,1]].forEach(function(off){
          ctx.beginPath();ctx.arc(ox+(p.c+off[0])*cs,oy+(p.r+off[1])*cs,dr,0,Math.PI*2);ctx.fill();
        });
      });
      ctx.fillStyle = '#aaa'; ctx.font = '20px monospace'; ctx.textAlign = 'left';
      ctx.fillText('Layer '+(li+1)+': "'+layer.text+'"  |  thread: '+layer.color, ox, oy-14);
      yOffset += layer.mask.rows * cs + 60;
    }
    ctx.fillStyle = '#bbb'; ctx.font = '20px monospace'; ctx.textAlign = 'left';
    ctx.fillText('Scale: 1 cell = 5mm', margin, PH - margin + 4);
    return pc;
  }

  function showPatternModal() {

    a.href = pc.toDataURL('image/png');

  function pf(e) { var r=outCanvas.getBoundingClientRect(); return {x:Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),y:Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))}; }
  outCanvas.addEventListener('pointerdown', function(e) {
    outCanvas.setPointerCapture(e.pointerId);
    var p = pf(e);
    var best = -1, bestD = 0.25;
    for (var i = 0; i < layers.length; i++) {
      var dx = layers[i].pos.x - p.x, dy = layers[i].pos.y - p.y;
      var d = Math.sqrt(dx*dx + dy*dy);
      if (d < bestD) { bestD = d; best = i; }
    }
    if (best < 0 && layers.length > 0) {
      // fallback: pick active layer
      best = activeLayer;
    }
    if (best >= 0) {
      draggingLayer = best; activeLayer = best;
      stitchText.value = layers[best].text;
      threadColor.value = layers[best].color;
      var _fsel = document.getElementById('fontSize'); if(_fsel) _fsel.value = layers[best]._fontSize || '10';
      var _tsel = document.getElementById('threadThickness'); if(_tsel) _tsel.value = layers[best]._thickness || '0.70';
      updateLayerIndicator();
    } else {
      draggingLayer = -1;
    }
    if (!source||source.type==='image') renderAll();
  });
  outCanvas.addEventListener('pointermove', function(e) {
    if (draggingLayer < 0) return;
    layers[draggingLayer].pos = pf(e);
    if (!source||source.type==='image') renderAll();
  });
  outCanvas.addEventListener('pointerup',     function() { draggingLayer = -1; });
  outCanvas.addEventListener('pointercancel', function() { draggingLayer = -1; });

        a.download = 'stitchcard.png';
        document.body.appendChild(a); a.click(); a.remove();
        setStatus('Photo saved.');
      } catch(e) { setStatus('Save failed.'); }
      return;
    }
    try {
      var a = document.createElement('a');
      a.href = outCanvas.toDataURL('image/png');
      a.download = 'stitchcard.png';
      document.body.appendChild(a); a.click(); a.remove();
      setStatus('Saved.');
    } catch(e) { setStatus('Save failed.'); }
  });

    // ── Pattern button ────────────────────────────────────────────────────────
  document.getElementById('patternBtn').addEventListener('click', showPatternModal);

  // ── Video record button ────────────────────────────────────────────────────
  document.getElementById('videoRecBtn').addEventListener('click', function() {
    var self = this;
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      self.textContent = '🎬 Video';
      return;
    }
    if (typeof MediaRecorder === 'undefined') { setStatus('Video not supported.'); return; }
    recordedChunks = [];
    var stream = outCanvas.captureStream(20);
    if (cameraStream) {
      var audioTracks = cameraStream.getAudioTracks();
      if (audioTracks.length > 0) stream.addTrack(audioTracks[0]);
    }
    // Record as webm first, then convert to mp4 via ffmpeg.wasm
    var mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9'
                 : MediaRecorder.isTypeSupported('video/webm') ? 'video/webm'
                 : '';
    try {
      mediaRecorder = mimeType ? new MediaRecorder(stream, {mimeType:mimeType}) : new MediaRecorder(stream);
    } catch(err) { setStatus('Recording error: '+err.message); return; }
    mediaRecorder.ondataavailable = function(ev) { if (ev.data && ev.data.size > 0) recordedChunks.push(ev.data); };
    mediaRecorder.onstop = function() {
      setStatus('Converting to mp4…');
      var webmBlob = new Blob(recordedChunks, { type: 'video/webm' });
      convertToMp4(webmBlob, function(mp4Blob) {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(mp4Blob);
        a.download = 'stitchcard.mp4';
        document.body.appendChild(a); a.click(); a.remove();
        setStatus('Video saved as mp4!');
      }, function(err) {
        // fallback: save as webm
        var a = document.createElement('a');
        a.href = URL.createObjectURL(webmBlob);
        a.download = 'stitchcard.webm';
        document.body.appendChild(a); a.click(); a.remove();
        setStatus('Saved as webm (mp4 conversion failed).');
      });
    };
    mediaRecorder.start(100);
    self.textContent = '⏹ Stop';
    setStatus('Recording…');
  });

    function init() {
    layers = [];
    addLayer(stitchText.value, threadColor.value, "'Imperial Script', cursive");
    updateLayerIndicator();
    titleMask = rasterizeThin('Stitchcard', FONT_TITLE, 8);
    renderAll();
    renderTitle();
  }

  function waitForFonts(cb) {
    if (!document.fonts) { setTimeout(cb, 1000); return; }
    var fonts = [
      document.fonts.load("400 240px 'Pinyon Script'"),
      document.fonts.load("400 240px 'Imperial Script'")
    ];
    Promise.all(fonts).then(function() {
      requestAnimationFrame(function() { requestAnimationFrame(function() {
        cb();
        setTimeout(function() {
          for(var i=0;i<layers.length;i++) rebuildLayer(i);
          titleMask = rasterizeThin('Stitchcard', FONT_TITLE, 8);
          renderAll(); renderTitle();
          titleCanvas.style.visibility = 'visible';
        }, 100);
      }); });
    }).catch(function() { setTimeout(cb, 1000); });
  }


  // ── WebM → MP4 conversion via ffmpeg.wasm ────────────────────────────────
  var ffmpegLoaded = false;
  var ffmpegInstance = null;

  function loadFFmpeg(cb) {
    if (ffmpegLoaded) { cb(ffmpegInstance); return; }
    setStatus('Loading ffmpeg…');
    var script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/ffmpeg.wasm/0.11.0/ffmpeg.min.js';
    script.onload = function() {
      var createFFmpeg = FFmpeg.createFFmpeg;
      var fetchFile = FFmpeg.fetchFile;
      var ff = createFFmpeg({ log: false });
      ff.load().then(function() {
        ffmpegLoaded = true;
        ffmpegInstance = { ff: ff, fetchFile: fetchFile };
        cb(ffmpegInstance);
      }).catch(function(e) { setStatus('ffmpeg load failed.'); });
    };
    script.onerror = function() { setStatus('ffmpeg load failed.'); };
    document.head.appendChild(script);
  }

  function convertToMp4(webmBlob, onSuccess, onError) {
    loadFFmpeg(function(ffm) {
      var reader = new FileReader();
      reader.onload = function(e) {
        var uint8 = new Uint8Array(e.target.result);
        ffm.ff.FS('writeFile', 'input.webm', uint8);
        ffm.ff.run('-i', 'input.webm', '-c:v', 'libx264', '-preset', 'fast', '-movflags', '+faststart', 'output.mp4')
        .then(function() {
          var data = ffm.ff.FS('readFile', 'output.mp4');
          var mp4Blob = new Blob([data.buffer], { type: 'video/mp4' });
          ffm.ff.FS('unlink', 'input.webm');
          ffm.ff.FS('unlink', 'output.mp4');
          onSuccess(mp4Blob);
        }).catch(onError);
      };
      reader.readAsArrayBuffer(webmBlob);
    });
  }

    waitForFonts(init);
})();
</script>
</body>
